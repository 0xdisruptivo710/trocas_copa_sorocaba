<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="TrocasCopa">
  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="oklch(0.62 0.17 148)"/>
  <!-- Trave (T stylized) — duas estacas verticais + travessão -->
  <path d="M14 16 L14 44 M22 16 L22 44 M10 16 L26 16" stroke="oklch(1 0 0)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Rede (sutil) -->
  <path d="M14 22 L22 22 M14 28 L22 28 M14 34 L22 34 M14 40 L22 40" stroke="oklch(1 0 0 / 0.35)" stroke-width="1"/>
  <!-- Bola (C abraçando, descentralizada) -->
  <circle cx="42" cy="38" r="11" fill="oklch(0.86 0.17 92)" stroke="oklch(0.20 0.03 280)" stroke-width="1.5"/>
  <!-- Padrão pentagonal da bola -->
  <path d="M42 31 L46 34 L44 39 L40 39 L38 34 Z" fill="oklch(0.20 0.03 280)"/>
  <path d="M37 36 L33 39 M47 36 L51 39 M40 44 L38 49 M44 44 L46 49" stroke="oklch(0.20 0.03 280)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Acento vermelho (carnaval/EUA-CAN-MEX) — pequeno detalhe -->
  <circle cx="49" cy="18" r="3" fill="oklch(0.58 0.22 25)"/>
</svg>
